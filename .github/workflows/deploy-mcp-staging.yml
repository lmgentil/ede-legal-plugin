# .github/workflows/deploy-mcp-staging.yml — Etapa 6.2-C.4B.2.
#
# Prova ponta a ponta, sem chave JSON persistente:
#
#   GitHub Actions -> GitHub OIDC -> WIF -> ede-mcp-deployer -> Cloud
#   Build -> Artifact Registry -> deploy Cloud Run POR DIGEST ->
#   ede-mcp-smoke -> ID token -> Cloud Run IAM -> MCP SDK 2.2.0 ->
#   Streamable HTTP -> ede_health
#
# Infraestrutura já homologada nas Etapas 6.2-C.4A/4B.1 (ver
# docs/specs/SPEC-0001.md): ede-mcp-runtime (Cloud Run, zero roles de
# projeto), ede-mcp-deployer (cloudbuild.builds.editor no projeto,
# run.developer só em ede-mcp-staging, serviceAccountUser só sobre
# ede-mcp-runtime — nunca run.invoker), ede-mcp-smoke (run.invoker só em
# ede-mcp-staging — nunca poder de deploy), github-pool/github-provider
# (condition: repository_id, repository_owner_id, refs/heads/main). Este
# workflow não cria/altera nenhum desses recursos — só os USA.
#
# Duas identidades, nunca uma só: ede-mcp-deployer builda/deploya e
# NUNCA invoca o serviço; ede-mcp-smoke invoca o serviço e NUNCA
# builda/deploya. A troca de identidade dentro do job é feita por
# reautenticações sucessivas via google-github-actions/auth (cada
# chamada sobrescreve as Application Default Credentials do runner) —
# nunca por uma única identidade acumulando os dois poderes.
name: Deploy MCP Server (staging) — WIF, digest, smoke remoto

on:
  push:
    branches:
      - main
    paths:
      - "mcp_server/**"
      - "VERSION"
      - ".github/workflows/deploy-mcp-staging.yml"
      - ".github/ci/smoke_remoto_mcp.py"
  workflow_dispatch: {}

# Mínimas necessárias: contents:read para clonar, id-token:write para o
# runner poder solicitar o token OIDC do GitHub que a troca WIF consome.
# Nenhuma outra (sem packages, sem pull-requests, sem issues, sem
# actions:write) — nada além disso é usado neste workflow.
permissions:
  contents: read
  id-token: write

# Nunca cancelar um deploy em andamento (poderia deixar Cloud
# Build/Cloud Run em estado intermediário sem que o rollback deste
# workflow chegasse a rodar) — execuções concorrentes esperam a anterior
# terminar, nunca a interrompem.
concurrency:
  group: deploy-mcp-staging
  cancel-in-progress: false

env:
  PROJECT_ID: ede-legal-mcp-01
  PROJECT_NUMBER: "269134711029"
  REGION: southamerica-east1
  SERVICE: ede-mcp-staging
  REPOSITORY: ede-mcp
  IMAGE_NAME: mcp-server
  RUNTIME_SA: ede-mcp-runtime@ede-legal-mcp-01.iam.gserviceaccount.com
  DEPLOYER_SA: ede-mcp-deployer@ede-legal-mcp-01.iam.gserviceaccount.com
  SMOKE_SA: ede-mcp-smoke@ede-legal-mcp-01.iam.gserviceaccount.com
  WORKLOAD_IDENTITY_PROVIDER: projects/269134711029/locations/global/workloadIdentityPools/github-pool/providers/github-provider

jobs:
  deploy:
    name: Build por digest + deploy Cloud Run + smoke remoto autenticado
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # ------------------------------------------------------ checkout
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # -------------------------------------------------- test gate
      # Conjunto mínimo seguro (§5 do pedido): só os testes MCP, que não
      # dependem de skills/docx local, Modelo Oficial privado nem dados
      # jurídicos reais. scripts/requirements.txt (lxml) é necessário
      # mesmo aqui — conftest.py da raiz importa incondicionalmente
      # scripts/docx_template_engine.py (mesmo achado documentado em
      # .github/workflows/homologar-mcp-container.yml, Etapa 6.2-B).
      - name: Instalar dependências leves (pytest + mcp_server/ + scripts/requirements.txt)
        run: |
          python -m pip install --upgrade pip
          pip install pytest==9.1.1
          pip install -r mcp_server/requirements.txt
          pip install -r scripts/requirements.txt

      - name: "TEST GATE — Testes MCP (contrato in-memory — tests/test_mcp_server.py)"
        run: pytest tests/test_mcp_server.py -q

      - name: "TEST GATE — Streamable HTTP real (subprocess local — tests/test_mcp_streamable_http.py)"
        run: pytest tests/test_mcp_streamable_http.py -m mcp_transport -q

      # ---------------------------------------------- auth: ede-mcp-deployer
      - name: "Auth (WIF) — ede-mcp-deployer"
        id: auth-deployer
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - name: Instalar Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: ${{ env.PROJECT_ID }}

      # WIF PROOF — identidade provada pelo CONTEXTO DE AUTH, nunca por
      # `gcloud auth list` (defeito exposto na Etapa 6.2-C.4B.2T).
      #
      # Causa raiz, comprovada por evidência de hash no run 34737684469:
      # cada step da action escreve um arquivo de credencial próprio e
      # reexporta GOOGLE_APPLICATION_CREDENTIALS (5 arquivos distintos
      # naquele run), mas `gcloud auth list` reporta o CREDENTIAL STORE
      # PERSISTENTE, populado uma única vez pelo `setup-gcloud` logo após
      # o primeiro auth. Resultado: a asserção acusava ede-mcp-deployer
      # mesmo com o contexto correto apontando para ede-mcp-smoke.
      #
      # Evidência correta: o arquivo de credencial do PRÓPRIO step. O
      # código-fonte da action (v3.0.0, client/workload_identity_federation.ts)
      # grava `service_account_impersonation_url` =
      # .../serviceAccounts/<service_account>:generateAccessToken sempre
      # que `service_account` é informado — e o workflow informa o e-mail.
      #
      # O arquivo TAMBÉM contém um Bearer token em
      # credential_source.headers: seu conteúdo NUNCA é impresso; só o
      # veredito e o e-mail esperado (que já está no env do workflow).
      - name: "WIF PROOF — identidade do contexto de auth (esperado: ede-mcp-deployer)"
        env:
          EXPECTED_SA: ${{ env.DEPLOYER_SA }}
        run: |
          python - <<'PROOF'
          import json, os, sys
          esperado = os.environ["EXPECTED_SA"]
          caminho = os.environ.get("GOOGLE_APPLICATION_CREDENTIALS") or ""
          if not caminho or not os.path.exists(caminho):
              print("GATE FALHOU: contexto de auth sem arquivo de credencial — identidade não comprovável.")
              sys.exit(1)
          with open(caminho, encoding="utf-8") as fh:
              cfg = json.load(fh)
          # Evidência primária documentada no código da action; varredura
          # recursiva como reforço, sem depender de um único nome de campo.
          textos = []
          def varrer(o):
              if isinstance(o, dict):
                  for v in o.values(): varrer(v)
              elif isinstance(o, list):
                  for v in o: varrer(v)
              elif isinstance(o, str):
                  textos.append(o)
          varrer(cfg)
          blob = "\n".join(textos)
          conhecidas = {os.environ[k] for k in ("DEPLOYER_SA", "SMOKE_SA", "RUNTIME_SA") if os.environ.get(k)}
          presentes = {sa for sa in conhecidas if sa in blob}
          if esperado not in presentes:
              print(f"GATE FALHOU: o contexto de auth não identifica {esperado}.")
              print(f"  identidades conhecidas encontradas no contexto: {sorted(presentes) or 'nenhuma'}")
              sys.exit(1)
          if presentes - {esperado}:
              print(f"GATE FALHOU: contexto contaminado — identifica também {sorted(presentes - {esperado})}.")
              sys.exit(1)
          print(f"Identidade do contexto de auth confirmada: {esperado}")
          PROOF

      # --------------------------------------------------- baseline / rollback
      # Captura o ESTADO DE TRÁFEGO COMPLETO antes de qualquer alteração.
      #
      # Etapa 6.2-C.4B.2R/2S: o modelo anterior guardava só
      # `status.latestReadyRevisionName` como "revision anterior" — que NÃO
      # é a revision que serve tráfego. Na Etapa 2Q os dois divergiram
      # (latestReady=00003-pvs com 0% de tráfego, tráfego real em
      # 00002-dp6) e o rollback restaurou a revision errada. `spec.traffic`
      # é a intenção declarada de roteamento e a única fonte de verdade:
      # preserva percentuais múltiplos, `tag` e o alvo `latestRevision`.
      #
      # Extração via `--format=json` + stdlib do Python, nunca
      # `--format='value(spec.traffic...)'`: essa projeção emite repr de
      # dict Python com aspas simples (JSON INVÁLIDO), verificado na
      # Etapa 2S contra o serviço real.
      - name: "Baseline — snapshot COMPLETO de tráfego + identidade determinística da revision"
        id: baseline
        run: |
          gcloud run services describe "$SERVICE" --region="$REGION" --project="$PROJECT_ID" --format=json > /tmp/svc_pre.json
          PRE_TRAFFIC_JSON=$(python -c "
          import json
          d = json.load(open('/tmp/svc_pre.json'))
          print(json.dumps(d['spec'].get('traffic', []), separators=(',', ':')))
          ")
          SERVICE_URL=$(python -c "
          import json
          print(json.load(open('/tmp/svc_pre.json'))['status']['url'])
          ")
          PREVIOUS_IMAGE=$(python -c "
          import json
          print(json.load(open('/tmp/svc_pre.json'))['spec']['template']['spec']['containers'][0]['image'])
          ")
          if [ -z "$PRE_TRAFFIC_JSON" ] || [ "$PRE_TRAFFIC_JSON" = "[]" ]; then
            echo "GATE FALHOU: snapshot de tráfego vazio — rollback determinístico seria impossível."
            exit 1
          fi
          # Nome determinístico da revision: rastreável ao commit E ao run.
          # SHA sozinho colidiria em rerun ("Found a conflicting revision
          # name"), e reruns são frequentes nesta cadeia de etapas.
          REVISION_SUFFIX="${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          NEW_REVISION="${SERVICE}-${REVISION_SUFFIX}"
          # Restrições do Cloud Run: <=63 chars, minúsculas/dígitos/hífen,
          # não termina em hífen. Fail-closed, nunca truncar em silêncio
          # (truncar reintroduziria risco de colisão).
          if [ "${#NEW_REVISION}" -gt 63 ]; then
            echo "GATE FALHOU: nome de revision com ${#NEW_REVISION} chars excede o limite de 63: $NEW_REVISION"
            exit 1
          fi
          if ! printf '%s' "$NEW_REVISION" | grep -qE '^[a-z][a-z0-9-]*[a-z0-9]$'; then
            echo "GATE FALHOU: nome de revision inválido para o Cloud Run: $NEW_REVISION"
            exit 1
          fi
          echo "Tráfego pré-deploy (snapshot): $PRE_TRAFFIC_JSON"
          echo "Imagem anterior (template):    $PREVIOUS_IMAGE"
          echo "Service URL:                   $SERVICE_URL"
          echo "Revision desta execução:       $NEW_REVISION"
          {
            echo "PRE_TRAFFIC_JSON=$PRE_TRAFFIC_JSON"
            echo "SERVICE_URL=$SERVICE_URL"
            echo "REVISION_SUFFIX=$REVISION_SUFFIX"
            echo "NEW_REVISION=$NEW_REVISION"
          } >> "$GITHUB_ENV"
          echo "previous_image=$PREVIOUS_IMAGE" >> "$GITHUB_OUTPUT"

      # -------------------------------------------------------- build
      # Cloud Build, nunca `docker build` no runner — ede-mcp-deployer só
      # tem cloudbuild.builds.editor (sem artifactregistry.writer
      # próprio); é a service account de build do Cloud Build
      # (269134711029@cloudbuild.gserviceaccount.com, já com
      # roles/cloudbuild.builds.builder no projeto) quem publica no
      # Artifact Registry. Tag = SHA completo do commit que acionou o
      # workflow (nunca "latest").
      #
      # --gcs-source-staging-dir explícito (Etapa 6.2-C.4B.2G, achado da
      # 6.2-C.4B.2F/6.2-C.4B.2E): aponta para o MESMO bucket/prefixo que o
      # `gcloud builds submit` já usaria por padrão
      # (gs://ede-legal-mcp-01_cloudbuild/source) — não muda destino nem
      # conteúdo do staging. O único efeito é interno ao Cloud SDK: com o
      # parâmetro ausente, `default_gcs_source=True` liga
      # `check_ownership=True` em `CreateBucketIfNotExists`, que faz uma
      # chamada `Buckets.List(project=...)` extra (escopo de PROJETO) só
      # para provar que o bucket default pertence a este projeto
      # (proteção antibucket-squatting) — chamada que `ede-mcp-deployer`
      # não tem permissão de fazer (least-privilege intencional, sem
      # `storage.buckets.list` no projeto) e que três execuções reais
      # confirmaram ser a causa do bloqueio em `gcloud builds submit`
      # ("The user is forbidden from accessing the bucket [...]").
      # Informar o staging dir explicitamente faz `default_gcs_source=
      # False` -> `check_ownership=False`, eliminando essa chamada
      # `Buckets.List` sem afetar `Buckets.Get` (mantido, já coberto por
      # `roles/storage.bucketViewer` no bucket) nem o upload do source
      # (`roles/storage.objectCreator`, também só no bucket). Bucket já
      # verificado (Etapa 6.2-C.4B.2C/2F) como pertencente a este
      # projeto — nenhuma role de Storage nova, nenhuma no projeto.
      - name: "Build (Cloud Build) — tag = ${{ github.sha }}"
        id: build
        run: |
          IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"
          gcloud builds submit . \
            --project="$PROJECT_ID" \
            --config=mcp_server/cloudbuild.yaml \
            --substitutions=_IMAGE_URI="$IMAGE_URI" \
            --gcs-source-staging-dir=gs://ede-legal-mcp-01_cloudbuild/source

      # ------------------------------------------------- digest — determinístico
      # Nunca confiar só na tag: resolve o digest publicado consultando o
      # Artifact Registry diretamente (fully_qualified_digest já vem no
      # formato IMAGE_URI@sha256:..., pronto para o deploy).
      - name: "Resolver DIGEST publicado (determinístico, via Artifact Registry)"
        id: digest
        run: |
          FULL_DIGEST=$(gcloud artifacts docker images describe "$IMAGE_URI" --project="$PROJECT_ID" --format='value(image_summary.fully_qualified_digest)')
          if [ -z "$FULL_DIGEST" ]; then
            echo "GATE FALHOU: não foi possível resolver o digest publicado para $IMAGE_URI"
            exit 1
          fi
          echo "Digest publicado: $FULL_DIGEST"
          echo "FULL_DIGEST=$FULL_DIGEST" >> "$GITHUB_ENV"

      # -------------------------------------------------- deploy por digest
      # Só o necessário é passado — tudo mais (memória, concorrência,
      # timeout etc.) permanece o que já estava configurado na revision
      # anterior, preservado automaticamente pelo `gcloud run deploy`
      # quando a flag correspondente não é repetida.
      #
      # --no-traffic + --revision-suffix (Etapa 6.2-C.4B.2S): o deploy
      # NUNCA depende de migração implícita de tráfego. Na Etapa 2Q o
      # tráfego estava fixado por `update-traffic` numa revision nominal,
      # e a revision nova nasceu com 0% — os gates pós-deploy testaram a
      # revision ANTIGA sem que nada acusasse. Agora o roteamento é uma
      # transição explícita e verificada (step adiante), e a identidade da
      # revision é conhecida ANTES do deploy, não inferida depois.
      - name: "Deploy Cloud Run — imagem por DIGEST, sem tráfego, revision determinística"
        id: deploy
        run: |
          gcloud run deploy "$SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --image="$FULL_DIGEST" \
            --service-account="$RUNTIME_SA" \
            --no-allow-unauthenticated \
            --min-instances=0 \
            --no-traffic \
            --revision-suffix="$REVISION_SUFFIX" \
            --quiet

      # Identidade da revision: SEMPRE o nome determinístico calculado no
      # baseline. `status.latestReadyRevisionName` não é usado como
      # identidade (foi exatamente o que apontou para a revision errada na
      # Etapa 2Q); `latestCreatedRevisionName` entra só como verificação
      # cruzada — divergência é fail-closed, nunca palpite.
      - name: "Confirmar a revision EXATA desta execução (existe, READY, digest correto)"
        id: verify-revision
        run: |
          if ! gcloud run revisions describe "$NEW_REVISION" --region="$REGION" --project="$PROJECT_ID" --format=json > /tmp/rev_new.json 2>/tmp/rev_err.txt; then
            echo "GATE FALHOU: revision determinística não encontrada: $NEW_REVISION"
            cat /tmp/rev_err.txt
            exit 1
          fi
          REV_READY=$(python -c "
          import json
          d = json.load(open('/tmp/rev_new.json'))
          conds = d.get('status', {}).get('conditions', [])
          print(next((c.get('status') for c in conds if c.get('type') == 'Ready'), 'MISSING'))
          ")
          REV_IMAGE=$(python -c "
          import json
          print(json.load(open('/tmp/rev_new.json'))['spec']['containers'][0]['image'])
          ")
          LATEST_CREATED=$(gcloud run services describe "$SERVICE" --region="$REGION" --project="$PROJECT_ID" --format='value(status.latestCreatedRevisionName)')
          echo "Revision desta execução: $NEW_REVISION"
          echo "  Ready:                 $REV_READY"
          echo "  Imagem da revision:    $REV_IMAGE"
          echo "  latestCreated (cross): $LATEST_CREATED"
          if [ "$REV_READY" != "True" ]; then
            echo "GATE FALHOU: revision $NEW_REVISION não está READY (condition Ready=$REV_READY)."
            exit 1
          fi
          if [ "$LATEST_CREATED" != "$NEW_REVISION" ]; then
            echo "GATE FALHOU: divergência entre a revision determinística e latestCreatedRevisionName."
            echo "  determinística: $NEW_REVISION"
            echo "  latestCreated:  $LATEST_CREATED"
            exit 1
          fi
          # Verificação do digest NA REVISION, não em spec.template: a
          # Etapa 2Q provou que o template do serviço e o que de fato serve
          # tráfego podem divergir.
          if [ "$REV_IMAGE" != "$FULL_DIGEST" ]; then
            echo "GATE FALHOU: a revision não referencia o digest esperado."
            echo "  esperado: $FULL_DIGEST"
            echo "  obtido:   $REV_IMAGE"
            exit 1
          fi
          {
            echo "### Deploy — commit, imagem, digest, revision"
            echo '```'
            echo "commit:            $GITHUB_SHA"
            echo "image (tag):       $IMAGE_URI"
            echo "image (digest):    $FULL_DIGEST"
            echo "tráfego pré-run:   $PRE_TRAFFIC_JSON"
            echo "revision nova:     $NEW_REVISION (READY, 0% de tráfego neste ponto)"
            echo "runtime SA:        $RUNTIME_SA"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ------------------------------------ transição explícita de tráfego
      # Só depois de digest verificado NA revision correta. A partir daqui
      # o roteamento do serviço foi alterado — o marcador `changed=true` é
      # o que habilita o rollback (nunca inferência por nome de revision).
      - name: "Rotear 100% do tráfego para a revision desta execução (explícito e verificado)"
        id: traffic
        run: |
          echo "changed=true" >> "$GITHUB_OUTPUT"
          gcloud run services update-traffic "$SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --to-revisions="${NEW_REVISION}=100" \
            --quiet
          gcloud run services describe "$SERVICE" --region="$REGION" --project="$PROJECT_ID" --format=json > /tmp/svc_post.json
          EFFECTIVE=$(python -c "
          import json
          d = json.load(open('/tmp/svc_post.json'))
          tr = [t for t in d['status'].get('traffic', []) if t.get('percent')]
          print(json.dumps(sorted((t.get('revisionName'), t.get('percent')) for t in tr)))
          ")
          EXPECTED=$(python -c "
          import json, os
          print(json.dumps([[os.environ['NEW_REVISION'], 100]]))
          ")
          echo "Tráfego efetivo: $EFFECTIVE"
          if [ "$EFFECTIVE" != "$EXPECTED" ]; then
            echo "GATE FALHOU: tráfego efetivo não confirma 100% em $NEW_REVISION."
            echo "  esperado: $EXPECTED"
            echo "  obtido:   $EFFECTIVE"
            exit 1
          fi
          echo "Confirmado: 100% do tráfego em $NEW_REVISION — gates HTTP podem executar."

      # ---------------------------------------- negative test A — sem Authorization
      - name: "NEGATIVE TEST A — sem Authorization, esperado 403"
        run: |
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' "${SERVICE_URL}/mcp")
          echo "HTTP sem Authorization: $STATUS"
          if [ "$STATUS" != "403" ]; then
            echo "GATE FALHOU: endpoint sem Authorization retornou $STATUS, esperado 403."
            exit 1
          fi

      # ------------------------------------ negative test B — identidade deployer
      # ede-mcp-deployer nunca tem run.invoker — só serve para provar que
      # nem quem builda/deploya consegue invocar o serviço.
      #
      # O ID token vem desta action, nunca de `gcloud auth
      # print-identity-token --audiences=...` (Etapa 6.2-C.4B.2P): aquele
      # comando rejeita a credencial `external_account` produzida pelo WIF
      # — `ValidIdTokenCredential` (command_lib/auth/auth_util.py) só
      # aceita impersonation, chave de service account ou credencial do
      # GCE. Não é falha de IAM: nenhuma requisição HTTP chegava a ser
      # feita, e o teste negativo não provava nada. A action usa o caminho
      # nativo do WIF (`iam.serviceAccounts.getOpenIdToken`, já contido em
      # `roles/iam.workloadIdentityUser`, que ede-mcp-deployer possui no
      # próprio recurso) — nenhuma role nova, nenhum Token Creator.
      - name: "Auth (WIF) — ede-mcp-deployer (ID token, audience CORRETA — só para o NEGATIVE TEST B)"
        id: auth-deployer-idtoken
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
          token_format: id_token
          id_token_audience: ${{ env.SERVICE_URL }}

      - name: "NEGATIVE TEST B — ede-mcp-deployer tentando invocar, esperado 403 da camada Cloud Run"
        env:
          DEPLOYER_ID_TOKEN: ${{ steps.auth-deployer-idtoken.outputs.id_token }}
        run: |
          echo "::add-mask::$DEPLOYER_ID_TOKEN"
          if [ -z "$DEPLOYER_ID_TOKEN" ]; then
            echo "TOKEN/AUTH SETUP FAILURE: ID token da identidade ede-mcp-deployer não foi emitido."
            echo "O teste negativo NÃO foi executado — nenhuma conclusão sobre autorização pode ser tirada."
            exit 1
          fi
          STATUS=$(curl -s -o /tmp/b_body.txt -w '%{http_code}' -H "Authorization: Bearer ${DEPLOYER_ID_TOKEN}" "${SERVICE_URL}/mcp")
          echo "HTTP com identidade ede-mcp-deployer: $STATUS"
          # Fingerprint de CAMADA (Etapa 6.2-C.4B.2R/2S): status sozinho é
          # ambíguo. Na Etapa 2Q o deployer recebeu 400 — resposta da
          # APLICAÇÃO (envelope JSON-RPC), provando que a requisição passou
          # pela autorização e alcançou o container. Assinaturas reais
          # medidas na Etapa 2R:
          #   camada Cloud Run -> 403 + corpo HTML "403 Forbidden"
          #   aplicação MCP    -> 4xx + corpo {"jsonrpc":"2.0",...}
          # O corpo atravessa o proxy intacto; o header `server` não serve
          # como discriminador isolado (o Cloud Run o reescreve também nas
          # respostas da aplicação).
          if grep -q 'jsonrpc' /tmp/b_body.txt; then
            echo "UNEXPECTED CLOUD RUN AUTHORIZATION RESULT: a resposta veio da APLICAÇÃO (envelope JSON-RPC),"
            echo "ou seja, a requisição do deployer PASSOU pela autorização do Cloud Run e alcançou o container."
            echo "A separação deploy != invoke não está vigente."
            exit 1
          fi
          if [ "$STATUS" != "403" ]; then
            echo "UNEXPECTED CLOUD RUN AUTHORIZATION RESULT: ede-mcp-deployer recebeu HTTP $STATUS, esperado 403."
            echo "Token válido e audience correta — 2xx significaria que deploy capability virou invoke capability."
            exit 1
          fi
          if ! grep -qiE 'forbidden|does not have permission' /tmp/b_body.txt; then
            echo "UNEXPECTED CLOUD RUN AUTHORIZATION RESULT: 403 sem a assinatura de rejeição do Cloud Run."
            echo "Não é possível afirmar que a negação veio da camada de autorização."
            exit 1
          fi
          echo "OK — negação na CAMADA DE AUTORIZAÇÃO do Cloud Run (403, sem resposta da aplicação)."

      # ---------------------------------------------- auth: ede-mcp-smoke
      # Sobrescreve as ADC do runner — a partir daqui a identidade ativa
      # é ede-mcp-smoke, nunca mais ede-mcp-deployer, até uma
      # reautenticação explícita (rollback, se necessário).
      - name: "Auth (WIF) — ede-mcp-smoke (ID token, audience = URL real do serviço)"
        id: auth-smoke
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SMOKE_SA }}
          token_format: id_token
          id_token_audience: ${{ env.SERVICE_URL }}

      - name: Mascarar ID token da identidade smoke
        run: echo "::add-mask::${{ steps.auth-smoke.outputs.id_token }}"

      # Mesma prova por contexto de auth (ver comentário acima).
      - name: "WIF PROOF — identidade do contexto de auth (esperado: ede-mcp-smoke)"
        env:
          EXPECTED_SA: ${{ env.SMOKE_SA }}
        run: |
          python - <<'PROOF'
          import json, os, sys
          esperado = os.environ["EXPECTED_SA"]
          caminho = os.environ.get("GOOGLE_APPLICATION_CREDENTIALS") or ""
          if not caminho or not os.path.exists(caminho):
              print("GATE FALHOU: contexto de auth sem arquivo de credencial — identidade não comprovável.")
              sys.exit(1)
          with open(caminho, encoding="utf-8") as fh:
              cfg = json.load(fh)
          # Evidência primária documentada no código da action; varredura
          # recursiva como reforço, sem depender de um único nome de campo.
          textos = []
          def varrer(o):
              if isinstance(o, dict):
                  for v in o.values(): varrer(v)
              elif isinstance(o, list):
                  for v in o: varrer(v)
              elif isinstance(o, str):
                  textos.append(o)
          varrer(cfg)
          blob = "\n".join(textos)
          conhecidas = {os.environ[k] for k in ("DEPLOYER_SA", "SMOKE_SA", "RUNTIME_SA") if os.environ.get(k)}
          presentes = {sa for sa in conhecidas if sa in blob}
          if esperado not in presentes:
              print(f"GATE FALHOU: o contexto de auth não identifica {esperado}.")
              print(f"  identidades conhecidas encontradas no contexto: {sorted(presentes) or 'nenhuma'}")
              sys.exit(1)
          if presentes - {esperado}:
              print(f"GATE FALHOU: contexto contaminado — identifica também {sorted(presentes - {esperado})}.")
              sys.exit(1)
          print(f"Identidade do contexto de auth confirmada: {esperado}")
          PROOF

      # --------------------------------------- negative test D — audience incorreta
      # Identidade DELIBERADAMENTE ede-mcp-smoke, não o deployer: smoke TEM
      # run.invoker, então a única causa possível de rejeição é a audience.
      # Usar uma identidade sem run.invoker introduziria uma segunda causa
      # independente e destruiria o isolamento do teste. Token pela action,
      # pelo mesmo motivo do NEGATIVE TEST B acima.
      - name: "Auth (WIF) — ede-mcp-smoke (ID token, audience INCORRETA — só para o NEGATIVE TEST D)"
        id: auth-smoke-wrong-audience
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SMOKE_SA }}
          token_format: id_token
          id_token_audience: "https://wrong-audience.invalid.example"

      # Mesma prova por contexto de auth (ver comentário no primeiro WIF PROOF).
      - name: "WIF PROOF — identidade do contexto de auth (esperado: ede-mcp-smoke (contexto de audience incorreta))"
        env:
          EXPECTED_SA: ${{ env.SMOKE_SA }}
        run: |
          python - <<'PROOF'
          import json, os, sys
          esperado = os.environ["EXPECTED_SA"]
          caminho = os.environ.get("GOOGLE_APPLICATION_CREDENTIALS") or ""
          if not caminho or not os.path.exists(caminho):
              print("GATE FALHOU: contexto de auth sem arquivo de credencial — identidade não comprovável.")
              sys.exit(1)
          with open(caminho, encoding="utf-8") as fh:
              cfg = json.load(fh)
          textos = []
          def varrer(o):
              if isinstance(o, dict):
                  for v in o.values(): varrer(v)
              elif isinstance(o, list):
                  for v in o: varrer(v)
              elif isinstance(o, str):
                  textos.append(o)
          varrer(cfg)
          blob = "\n".join(textos)
          conhecidas = {os.environ[k] for k in ("DEPLOYER_SA", "SMOKE_SA", "RUNTIME_SA") if os.environ.get(k)}
          presentes = {sa for sa in conhecidas if sa in blob}
          if esperado not in presentes:
              print(f"GATE FALHOU: o contexto de auth não identifica {esperado}.")
              print(f"  identidades conhecidas encontradas no contexto: {sorted(presentes) or 'nenhuma'}")
              sys.exit(1)
          if presentes - {esperado}:
              print(f"GATE FALHOU: contexto contaminado — identifica também {sorted(presentes - {esperado})}.")
              sys.exit(1)
          print(f"Identidade do contexto de auth confirmada: {esperado}")
          PROOF

      - name: "NEGATIVE TEST D — audience incorreta, esperado 401 (nunca 2xx)"
        env:
          WRONG_AUDIENCE_TOKEN: ${{ steps.auth-smoke-wrong-audience.outputs.id_token }}
        run: |
          echo "::add-mask::$WRONG_AUDIENCE_TOKEN"
          if [ -z "$WRONG_AUDIENCE_TOKEN" ]; then
            echo "TOKEN/AUTH SETUP FAILURE: ID token de audience incorreta não foi emitido."
            echo "O teste negativo NÃO foi executado — nenhuma conclusão sobre validação de audience pode ser tirada."
            exit 1
          fi
          STATUS=$(curl -s -o /tmp/d_body.txt -w '%{http_code}' -H "Authorization: Bearer ${WRONG_AUDIENCE_TOKEN}" "${SERVICE_URL}/mcp")
          echo "HTTP com audience incorreta: $STATUS"
          # Reforço de camada: a rejeição por audience é da camada de
          # AUTENTICAÇÃO do Cloud Run e nunca produz envelope JSON-RPC.
          if grep -q 'jsonrpc' /tmp/d_body.txt; then
            echo "SECURITY GATE FALHOU: a resposta veio da APLICAÇÃO — token de audience incorreta alcançou o container."
            exit 1
          fi
          case "$STATUS" in
            2??)
              echo "SECURITY GATE FALHOU: ID token com audience incorreta foi ACEITO (HTTP $STATUS)."
              exit 1
              ;;
            401)
              echo "OK — Cloud Run rejeitou por falha de AUTENTICAÇÃO (audience inválida), como esperado."
              ;;
            403)
              echo "SEMANTIC GATE FALHOU: rejeição veio como 403 (autorização), não 401 (audience)."
              echo "ede-mcp-smoke TEM run.invoker, logo 403 indica que o isolamento da audience não foi demonstrado."
              exit 1
              ;;
            *)
              echo "GATE FALHOU: status inesperado $STATUS — esperado 401 (rejeição por audience)."
              exit 1
              ;;
          esac

      # --------------------------------------- negative test C / smoke MCP real
      # O único uso do ID token correto (audience = URL real do serviço)
      # é este — nunca impresso, nunca logado, passado só via env para o
      # processo Python (mesma variável que smoke_remoto_mcp.py lê).
      - name: "SMOKE MCP REMOTO — MCP SDK 2.2.0, Streamable HTTP, Cloud Run real, ede_health"
        env:
          EDE_MCP_SMOKE_TOKEN: ${{ steps.auth-smoke.outputs.id_token }}
        run: |
          # Reconfirma, imediatamente antes do smoke, que quem serve o
          # tráfego é a revision desta execução — a Etapa 2Q validou a
          # revision ERRADA por não checar isto (o único ede_health bem
          # sucedido foi contra a revision restaurada pelo rollback).
          SERVING=$(gcloud run services describe "$SERVICE" --region="$REGION" --project="$PROJECT_ID" --format=json \
            | python -c "
          import json, sys
          d = json.load(sys.stdin)
          tr = [t for t in d['status'].get('traffic', []) if t.get('percent')]
          print(json.dumps(sorted((t.get('revisionName'), t.get('percent')) for t in tr)))
          ")
          EXPECTED_SERVING=$(python -c "
          import json, os
          print(json.dumps([[os.environ['NEW_REVISION'], 100]]))
          ")
          echo "Servindo tráfego agora: $SERVING"
          if [ "$SERVING" != "$EXPECTED_SERVING" ]; then
            echo "GATE FALHOU: o smoke positivo não pode atestar a revision desta execução."
            echo "  esperado: $EXPECTED_SERVING"
            echo "  obtido:   $SERVING"
            exit 1
          fi
          echo "Smoke executará contra a revision desta execução: $NEW_REVISION"
          EXPECTED_VERSION=$(cat VERSION)
          python .github/ci/smoke_remoto_mcp.py "${SERVICE_URL}/mcp" --expected-version "$EXPECTED_VERSION" | tee -a "$GITHUB_STEP_SUMMARY"

      # ============================================================
      # ROLLBACK — condicionado ao MARCADOR DE TRÁFEGO
      # (steps.traffic.outputs.changed), nunca ao outcome do deploy.
      # Com --no-traffic um deploy bem-sucedido NÃO altera roteamento:
      # falhas anteriores à transição (revision não READY, digest
      # divergente) não têm o que reverter, e disparar rollback ali mexeria
      # no tráfego sem necessidade. O marcador é gravado ANTES do
      # update-traffic, de modo que uma transição parcial também seja
      # revertida. Roda mesmo com o job já marcado como failure — isso é
      # INTENCIONAL (fail-closed): o job permanece FAILURE mesmo com
      # rollback bem-sucedido, porque o deploy não foi validado.
      # ============================================================
      - name: "ROLLBACK — reautenticar como ede-mcp-deployer"
        id: auth-deployer-rollback
        if: failure() && steps.traffic.outputs.changed == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - name: "ROLLBACK — restaurar o snapshot COMPLETO de tráfego pré-deploy"
        if: failure() && steps.traffic.outputs.changed == 'true'
        run: |
          # Restaura exatamente o que existia antes, a partir do snapshot
          # do baseline — nunca um nome derivado de
          # latestReadyRevisionName (erro da Etapa 2Q, que restaurou uma
          # revision que não era a que servia tráfego). Suporta alvo
          # LATEST, revision nominal única, split entre várias revisions e
          # tags. Parsing pela stdlib do Python, nunca JSON em shell.
          python - > /tmp/restore_args.sh << 'EOF'
          import json, os, shlex
          traffic = json.loads(os.environ["PRE_TRAFFIC_JSON"])
          pcts, tags = [], []
          for t in traffic:
              name = "LATEST" if t.get("latestRevision") else t.get("revisionName")
              if not name:
                  raise SystemExit(f"target invalido no snapshot: {t}")
              if t.get("percent"):
                  pcts.append(f"{name}={t['percent']}")
              if t.get("tag"):
                  tags.append(f"{t['tag']}={name}")
          if not pcts:
              raise SystemExit("snapshot sem percentuais de trafego")
          print("TO_REVISIONS=" + shlex.quote(",".join(pcts)))
          print("SET_TAGS=" + shlex.quote(",".join(tags)))
          EOF
          . /tmp/restore_args.sh
          echo "Restaurando tráfego pré-deploy: $TO_REVISIONS (tags: ${SET_TAGS:-nenhuma})"
          if [ -n "$SET_TAGS" ]; then
            gcloud run services update-traffic "$SERVICE" \
              --project="$PROJECT_ID" --region="$REGION" \
              --to-revisions="$TO_REVISIONS" --set-tags="$SET_TAGS" --quiet
          else
            gcloud run services update-traffic "$SERVICE" \
              --project="$PROJECT_ID" --region="$REGION" \
              --to-revisions="$TO_REVISIONS" --clear-tags --quiet
          fi
          # Conferência SEMÂNTICA (conjuntos normalizados), nunca
          # comparação de JSON cru: ordem e campos acrescentados pelo
          # servidor podem diferir legitimamente.
          gcloud run services describe "$SERVICE" --region="$REGION" --project="$PROJECT_ID" --format=json > /tmp/svc_restored.json
          python - << 'EOF'
          import json, os, sys
          def norm(traffic):
              pcts, tags = set(), set()
              for t in traffic:
                  name = "LATEST" if t.get("latestRevision") else t.get("revisionName")
                  if t.get("percent"):
                      pcts.add((name, t["percent"]))
                  if t.get("tag"):
                      tags.add((t["tag"], name))
              return pcts, tags
          esperado = norm(json.loads(os.environ["PRE_TRAFFIC_JSON"]))
          obtido = norm(json.load(open("/tmp/svc_restored.json"))["status"].get("traffic", []))
          if esperado != obtido:
              print("ROLLBACK FALHOU: estado restaurado difere do snapshot pré-deploy.")
              print("  esperado:", esperado)
              print("  obtido:  ", obtido)
              sys.exit(1)
          print("Rollback confirmado — tráfego pré-deploy restaurado semanticamente.")
          EOF
          {
            echo "### ROLLBACK executado"
            echo '```'
            echo "de:   $NEW_REVISION (digest $FULL_DIGEST)"
            echo "para: $PRE_TRAFFIC_JSON"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "ROLLBACK — reautenticar como ede-mcp-smoke para novo ede_health"
        id: auth-smoke-rollback
        if: failure() && steps.traffic.outputs.changed == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SMOKE_SA }}
          token_format: id_token
          id_token_audience: ${{ env.SERVICE_URL }}

      - name: Mascarar ID token pós-rollback
        if: failure() && steps.traffic.outputs.changed == 'true'
        run: echo "::add-mask::${{ steps.auth-smoke-rollback.outputs.id_token }}"

      # Mesma prova por contexto de auth (ver comentário no primeiro WIF PROOF).
      - name: "WIF PROOF — identidade do contexto de auth (esperado: ede-mcp-smoke (contexto de rollback))"
        if: failure() && steps.traffic.outputs.changed == 'true'
        env:
          EXPECTED_SA: ${{ env.SMOKE_SA }}
        run: |
          python - <<'PROOF'
          import json, os, sys
          esperado = os.environ["EXPECTED_SA"]
          caminho = os.environ.get("GOOGLE_APPLICATION_CREDENTIALS") or ""
          if not caminho or not os.path.exists(caminho):
              print("GATE FALHOU: contexto de auth sem arquivo de credencial — identidade não comprovável.")
              sys.exit(1)
          with open(caminho, encoding="utf-8") as fh:
              cfg = json.load(fh)
          textos = []
          def varrer(o):
              if isinstance(o, dict):
                  for v in o.values(): varrer(v)
              elif isinstance(o, list):
                  for v in o: varrer(v)
              elif isinstance(o, str):
                  textos.append(o)
          varrer(cfg)
          blob = "\n".join(textos)
          conhecidas = {os.environ[k] for k in ("DEPLOYER_SA", "SMOKE_SA", "RUNTIME_SA") if os.environ.get(k)}
          presentes = {sa for sa in conhecidas if sa in blob}
          if esperado not in presentes:
              print(f"GATE FALHOU: o contexto de auth não identifica {esperado}.")
              print(f"  identidades conhecidas encontradas no contexto: {sorted(presentes) or 'nenhuma'}")
              sys.exit(1)
          if presentes - {esperado}:
              print(f"GATE FALHOU: contexto contaminado — identifica também {sorted(presentes - {esperado})}.")
              sys.exit(1)
          print(f"Identidade do contexto de auth confirmada: {esperado}")
          PROOF

      - name: "ROLLBACK — repetir ede_health na revision restaurada"
        if: failure() && steps.traffic.outputs.changed == 'true'
        env:
          EDE_MCP_SMOKE_TOKEN: ${{ steps.auth-smoke-rollback.outputs.id_token }}
        run: |
          EXPECTED_VERSION=$(cat VERSION)
          {
            echo "### ede_health após rollback (tráfego restaurado: $PRE_TRAFFIC_JSON)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          python .github/ci/smoke_remoto_mcp.py "${SERVICE_URL}/mcp" --expected-version "$EXPECTED_VERSION" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
