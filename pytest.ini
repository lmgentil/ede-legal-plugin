[pytest]
addopts = --strict-markers
markers =
    rag: testes do subsistema RAG, incluindo artefatos persistidos e gold set
    docx_real: testes que exigem o modelo institucional DOCX privado disponível localmente
    pipeline_e2e: testes end-to-end locais do pipeline Python da Contestação; não representam execução do host Claude
    network: smoke tests opt-in que acessam serviços externos reais; vazio enquanto não houver teste autorizado
