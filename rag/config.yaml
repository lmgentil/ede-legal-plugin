# rag/config.yaml — configuração centralizada do RAG jurídico (SPEC-0001 REQ-044).
#
# Religado em Fase 4 (RAG Jurídico): search_hybrid.py lê este arquivo via
# _carregar_config() e usa os valores abaixo em vez das constantes internas
# antigas. Se pyyaml não estiver instalado ou o arquivo não puder ser lido,
# cai para os mesmos valores hardcoded de antes (aviso no console) — nenhuma
# mudança de comportamento nesse caso de degradação.

busca_hibrida:
  alpha: 0.65  # peso do BM25 vs. denso; calibrado empiricamente em 2026-07
  peso_rerank_cobertura: 0.05  # estágio de reranking (Fase 4): reforço pela
    # cobertura de termos ao reordenar os top-3k candidatos da fusão antes
    # do corte final em k. Pequeno por design — desempate, não substituição
    # do score de fusão.

confianca:
  lsa:
    alta_bm25: 10.0
    alta_cosseno: 0.60
    alta_cobertura: 0.85
    baixa_bm25: 6.0
    baixa_cosseno: 0.50
    baixa_cobertura: 0.50
  semantico:
    alta_bm25: 9.0
    alta_cobertura: 0.75
    alta_cosseno: 0.55
    baixa_score_composto: 1.4

embeddings:
  modelo_semantico: sentence-transformers/paraphrase-multilingual-mpnet-base-v2
  fallback: tfidf_lsa
  dimensao_lsa: 256
  dimensao_semantica: 768

corpus:
  versao: "v3 (2026-07-09)"
  total_chunks: 434
  diplomas: [CPC, CC, CDC, L8987, L9427, REN1000]
  # jurisprudencia: ainda não indexada na busca híbrida — adiado por decisão
  # do usuário na Fase 4 (PEND-002, docs/PENDENCIAS.md; ADR-0006)

diretorios:
  base: rag/
  embeddings: rag/embeddings/
  embeddings_semantico: rag/embeddings/semantic/

logging:
  nivel: INFO

# Fase 5 — Validação Jurídica (rag/legal_validation/). REQ-025: autoridade
# é propriedade da FONTE (compilado oficial? enunciado? fonte secundária?),
# nunca da vigência da norma (isso é outro eixo, sempre NAO_VERIFICADA hoje
# — ver rag/legal_validation/temporal_status.py). Corpus fora deste mapa
# cai em NAO_VERIFICADA (fail closed), nunca um nível inventado.
validacao_juridica:
  autoridade_por_corpus:
    CPC: OFICIAL       # compilado Planalto
    CC: OFICIAL         # compilado Planalto
    CDC: OFICIAL        # compilado Planalto
    L8987: OFICIAL      # compilado Planalto
    L9427: OFICIAL      # compilado Planalto
    REN1000: OFICIAL    # publicada pela ANEEL
