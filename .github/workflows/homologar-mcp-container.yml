# .github/workflows/homologar-mcp-container.yml — Etapa 6.2-B; estendido
# no Gate 6.4-B (§17) com publicação OPCIONAL do candidato imutável.
#
# Laboratório EFÊMERO em runner Linux padrão do GitHub Actions para
# provar o container real do EDE MCP Server (mcp_server/Dockerfile +
# .dockerignore) fora desta máquina — sem instalar Docker/WSL localmente.
#
# Disparo: SOMENTE manual (workflow_dispatch). Deliberadamente sem
# push/pull_request/schedule — o usuário aciona explicitamente quando
# quiser rodar este gate.
#
# Nunca acessa: Modelo Oficial (templates/contestacao/modelo-oficial.docx
# — nunca commitado, ADR-0009), rag/jurisprudencia/ (privado, fora do
# repositório), documentos jurídicos reais de caso, secrets do EDE.
#
# `publicar_candidato` (default `false`): com o default, o comportamento
# é EXATAMENTE o da Etapa 6.2-B — build+testes efêmeros, nenhum acesso a
# GCP, nenhuma publicação, imagem descartada ao fim do job. Só quando
# `true` (Gate 6.4-B) o job, DEPOIS de todos os testes acima já terem
# passado, autentica via WIF (mesma identidade `ede-mcp-deployer` e o
# mesmo `mcp_server/cloudbuild.yaml` já homologados em
# .github/workflows/deploy-mcp-staging.yml — nenhuma infraestrutura/
# identidade nova) e publica a imagem no MESMO repositório Artifact
# Registry (`ede-mcp`), sob uma tag distinta (`-candidato`, nunca
# colidindo com a tag `${GITHUB_SHA}` simples que o deploy de staging
# usa). Este workflow NUNCA chama `gcloud run deploy` — publicar no
# Artifact Registry é build/armazenamento, não é implantação; nenhuma
# revisão do Cloud Run é criada, nenhum tráfego é roteado.
#
# Runner: ubuntu-latest, hospedado pelo GitHub (não self-hosted, não
# "larger runner").
name: Homologação do container EDE MCP (efêmera; publicação opcional no Artifact Registry)

on:
  workflow_dispatch:
    inputs:
      publicar_candidato:
        description: >-
          Publicar a imagem homologada como candidato imutável no
          Artifact Registry (gs/ede-mcp/mcp-server) após todos os
          testes passarem. NUNCA implanta no Cloud Run.
        type: boolean
        default: false

# contents:read para clonar; id-token:write só é consumida quando
# `publicar_candidato=true` (troca WIF) — presente sempre porque
# `permissions:` é estático por workflow, mas inofensiva quando não
# usada (nenhum outro step deste job solicita token OIDC).
permissions:
  contents: read
  id-token: write

# Evita duas execuções concorrentes deste gate no mesmo runner lógico.
concurrency:
  group: homologacao-container-ede-mcp
  cancel-in-progress: true

jobs:
  homologar:
    name: Build real + testes reais do container (publicação de candidato opcional)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROJECT_ID: ede-legal-mcp-01
      REGION: southamerica-east1
      REPOSITORY: ede-mcp
      IMAGE_NAME: mcp-server
      DEPLOYER_SA: ede-mcp-deployer@ede-legal-mcp-01.iam.gserviceaccount.com
      WORKLOAD_IDENTITY_PROVIDER: projects/269134711029/locations/global/workloadIdentityPools/github-pool/providers/github-provider
    steps:
      # ------------------------------------------------------ checkout
      - name: Checkout (clone limpo — sem modelo-oficial.docx, sem skills/docx/, ambos gitignored)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Python 3.12 (host do runner — fora do container)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # ----------------------------------------- dependências LEVES
      # Só o necessário para os testes MCP existentes e para o cliente
      # MCP auxiliar deste workflow — instalado ANTES do build/testes do
      # container, para falhar rápido (fail-fast) sem pagar o custo das
      # dependências pesadas de rag/ caso o container já falhe aqui.
      # pytest==9.1.1 pinado na mesma versão já usada localmente
      # (evidência: tests/__pycache__/*-pytest-9.1.1.pyc nesta máquina).
      #
      # scripts/requirements.txt (só `lxml`, leve) entra aqui também —
      # achado real da primeira execução deste workflow (run 34555738591):
      # conftest.py da raiz do repo é o entrypoint de QUALQUER `pytest`
      # nesta suíte (mesmo rodando só tests/test_mcp_server.py) e importa
      # incondicionalmente scripts/docx_template_engine.py, que por sua
      # vez faz `import lxml.etree` no topo do módulo — sem essa
      # dependência instalada, todo `pytest` (inclusive os testes MCP que
      # nada têm a ver com DOCX) falhava na coleta com
      # ModuleNotFoundError. rag/requirements.txt (pyarrow, pandas,
      # numpy, scipy, scikit-learn, sentence-transformers/torch — essas
      # sim pesadas) continua deferida para mais tarde, só antes da
      # suíte completa.
      - name: Instalar dependências leves (pytest + mcp_server/ + scripts/requirements.txt)
        run: |
          python -m pip install --upgrade pip
          pip install pytest==9.1.1
          pip install -r mcp_server/requirements.txt
          pip install -r scripts/requirements.txt

      - name: Testes MCP (contrato in-memory — tests/test_mcp_server.py)
        run: pytest tests/test_mcp_server.py -q

      - name: Teste Streamable HTTP real (subprocess local, FORA do container — tests/test_mcp_streamable_http.py)
        run: pytest tests/test_mcp_streamable_http.py -m mcp_transport -q

      # ------------------------------------------------ digest — informativo
      # NUNCA reescreve o Dockerfile. Só compara o digest PINADO com o
      # digest ATUAL da tag "python:3.12-slim" para registro no gate. Se
      # o digest pinado não puder mais ser resolvido, o step de build
      # (abaixo) falha sozinho — não há aqui nenhuma lógica de
      # auto-correção.
      - name: "Digest da imagem-base: pinado (Dockerfile) vs. atual (tag) — informativo"
        run: |
          {
            echo "### Digest da imagem-base python:3.12-slim"
            echo '```'
            grep '^FROM' mcp_server/Dockerfile
            docker pull python:3.12-slim
            echo -n "Digest ATUAL resolvido para a tag python:3.12-slim: "
            docker inspect --format='{{index .RepoDigests 0}}' python:3.12-slim
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # -------------------------------------------------------- build real
      - name: Build real da imagem (mcp_server/Dockerfile + .dockerignore já aprovados)
        env:
          DOCKER_BUILDKIT: "1"
        run: docker build -f mcp_server/Dockerfile -t ede-mcp:ci .

      - name: Registrar metadados reais da imagem construída
        run: |
          {
            echo "### Metadados reais da imagem"
            echo '```'
            echo "Image ID:     $(docker image inspect ede-mcp:ci --format '{{.Id}}')"
            echo "Tamanho:      $(docker image inspect ede-mcp:ci --format '{{.Size}}') bytes"
            echo "Arquitetura:  $(docker image inspect ede-mcp:ci --format '{{.Architecture}}')"
            echo "Python real:  $(docker run --rm ede-mcp:ci python --version)"
            echo "mcp real:     $(docker run --rm ede-mcp:ci python -c 'import importlib.metadata as m; print(m.version("mcp"))')"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------------- inventário real
      #
      # Atualizado no Gate 6.4-B: `lxml` (Gate 6.4-A) e `google-auth` +
      # `pyasn1`/`pyasn1-modules` (Gate 6.4-B, transitivas de
      # `google-auth`) deixaram de ser proibidas — são dependências
      # legítimas declaradas em mcp_server/requirements.txt (contrato do
      # Modelo Oficial + aquisição via GCS, ver comentários lá). A lista
      # de proibidas continua cobrindo tudo que RAG (análise/busca
      # pesada) ou um SDK de nuvem completo trariam — nada disso deve
      # aparecer mesmo transitivamente.
      - name: "Inventário de dependências da imagem (pip freeze) + checagem de proibidas"
        run: |
          docker run --rm ede-mcp:ci python -m pip freeze | tee pip-freeze-imagem.txt
          {
            echo "### Inventário de dependências da imagem (pip freeze)"
            echo '```'
            cat pip-freeze-imagem.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          achado=0
          for proibida in pyarrow rank_bm25 sentence-transformers sentence_transformers pandas numpy scikit-learn scipy joblib google-cloud requests grpcio protobuf; do
            if grep -iE "^${proibida}(==| )" pip-freeze-imagem.txt; then
              echo "GATE FALHOU: dependência proibida presente na imagem do container: $proibida"
              achado=1
            fi
          done
          # `pip freeze` normaliza hífen/underscore de forma inconsistente
          # entre pacotes (PEP 503 trata os dois como equivalentes) —
          # "pyasn1-modules" aparece como "pyasn1_modules==...". O padrão
          # aceita qualquer um dos dois separadores, nunca hardcoda um só.
          for esperada in lxml google-auth pyasn1 pyasn1-modules; do
            padrao=$(echo "$esperada" | sed 's/-/[-_]/g')
            if ! grep -iE "^${padrao}(==| )" pip-freeze-imagem.txt; then
              echo "GATE FALHOU: dependência esperada ausente da imagem do container: $esperada"
              achado=1
            fi
          done
          if [ "$achado" = "1" ]; then
            echo "Ver acima qual(is) dependência(s) proibida(s) a imagem instalou (ou qual esperada faltou) e por qual linha de mcp_server/requirements.txt ela entrou/deveria entrar."
            exit 1
          fi
          echo "OK — só as dependências esperadas (lxml, google-auth + transitivas puro-Python) estão na imagem." | tee -a "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------------- usuário não-root
      - name: Prova de usuário não-root (UID/GID reais em runtime)
        run: |
          uid="$(docker run --rm ede-mcp:ci id -u)"
          gid="$(docker run --rm ede-mcp:ci id -g)"
          nome="$(docker run --rm ede-mcp:ci id -un)"
          {
            echo "### Usuário em runtime"
            echo '```'
            echo "id: uid=$uid gid=$gid usuario=$nome"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$uid" != "10001" ]; then
            echo "GATE FALHOU: processo não roda como UID 10001 (obtido: $uid)"
            exit 1
          fi
          if [ "$uid" = "0" ]; then
            echo "GATE FALHOU: processo rodando como root."
            exit 1
          fi

      # -------------------------------------------------- testes negativos
      #
      # Atualizado no Gate 6.4-B: `templates/contestacao/{schema,blocos}.
      # json`, `scripts/{legal_readiness,docx_package,docx_template_
      # engine,docx_block_engine,docx_numeracao_engine,instalar_modelo_
      # oficial}.py` e `rag/{corpus_manifest.json,chunks_*/}` PASSARAM A
      # EXISTIR legitimamente na imagem desde o Gate 6.4-A (ADR-0017 §6)
      # — a checagem de diretório inteiro ausente ficou obsoleta e
      # falsearia neste gate. A prova de que NENHUM asset privado entrou
      # continua sendo: (1) a busca por QUALQUER `.docx` na imagem
      # inteira (mais forte que checar um diretório — pega o Modelo
      # Oficial em qualquer nome/caminho), preservada sem alteração; (2)
      # uma lista fechada de caminhos/nomes que NUNCA podem existir,
      # mesmo parcialmente; (3) um allowlist FECHADO do que pode existir
      # dentro de scripts/templates/rag — qualquer arquivo além dele já é
      # achado indevido, mesmo sem ser sensível por natureza (mesma
      # disciplina de fail-closed do .dockerignore).
      - name: "Testes negativos: ausência de assets sensíveis DENTRO da imagem real (não confia só no .dockerignore)"
        run: |
          docker run --rm ede-mcp:ci sh -c '
            set -e
            for p in skills skills/docx tests docs .git .claude .claude-plugin .env ede-private jurisprudencia; do
              if [ -e "/app/$p" ] || [ -e "/$p" ]; then
                echo "ENCONTRADO INDEVIDAMENTE NA IMAGEM: $p"
                exit 1
              fi
            done
            achados=$(find / -xdev -iname "*.docx" 2>/dev/null || true)
            if [ -n "$achados" ]; then
              echo "DOCX ENCONTRADO NA IMAGEM: $achados"
              exit 1
            fi
            if [ -d /app/rag/embeddings ]; then
              echo "rag/embeddings/ ENCONTRADO INDEVIDAMENTE NA IMAGEM (não necessário para a checagem de saúde)"
              exit 1
            fi
            achados_scripts=$(find /app/scripts -maxdepth 1 -type f ! -name "requirements.txt" \
              ! -name "legal_readiness.py" ! -name "docx_package.py" \
              ! -name "docx_template_engine.py" ! -name "docx_block_engine.py" \
              ! -name "docx_numeracao_engine.py" ! -name "instalar_modelo_oficial.py" 2>/dev/null || true)
            if [ -n "$achados_scripts" ]; then
              echo "ARQUIVO INESPERADO EM /app/scripts NA IMAGEM: $achados_scripts"
              exit 1
            fi
            achados_templates=$(find /app/templates -type f ! -path "*/contestacao/schema.json" \
              ! -path "*/contestacao/blocos.json" 2>/dev/null || true)
            if [ -n "$achados_templates" ]; then
              echo "ARQUIVO INESPERADO EM /app/templates NA IMAGEM: $achados_templates"
              exit 1
            fi
            achados_rag=$(find /app/rag -maxdepth 1 -type f ! -name "corpus_manifest.json" 2>/dev/null || true)
            if [ -n "$achados_rag" ]; then
              echo "ARQUIVO INESPERADO NA RAIZ DE /app/rag NA IMAGEM: $achados_rag"
              exit 1
            fi
            for d in $(find /app/rag -maxdepth 1 -mindepth 1 -type d 2>/dev/null || true); do
              base=$(basename "$d")
              case "$base" in
                chunks_CPC|chunks_CC|chunks_CDC|chunks_L8987|chunks_L9427|chunks_REN1000) ;;
                *) echo "DIRETORIO INESPERADO EM /app/rag NA IMAGEM: $base"; exit 1 ;;
              esac
            done
            echo "OK — nenhum asset sensivel encontrado na imagem real; scripts/templates/rag batem exatamente com o allowlist do Gate 6.4-A/6.4-B."
          '

      # ----------------------------------------------------- runtime real
      # PORT customizada e distinta de 8080/8765 (exemplo conceitual do
      # gate, não vira default do produto). Publica SÓ 9123 — achado real
      # da 1a execução deste gate (run 34555870396): publicar -p também
      # para 8080/8765 (para "testar" que elas recusam) faz o Docker
      # userland-proxy escutar nesses PORTOS DO HOST mesmo sem NADA
      # ouvindo dentro do container — o handshake TCP então é aceito
      # pelo próprio docker-proxy, não pelo processo, dando falso
      # positivo de "a porta aceitou conexão". A prova correta é
      # inspecionar o processo DENTRO do container (próximo step), nunca
      # tentar conectar via uma porta publicada só para o teste.
      - name: Subir container real com PORT customizada (9123)
        run: |
          docker run -d --name ede-mcp-ci \
            -e PORT=9123 \
            -p 9123:9123 \
            ede-mcp:ci
          ok=""
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -m 1 http://127.0.0.1:9123/mcp; then
              ok=1
              break
            fi
            sleep 1
          done
          if [ -z "$ok" ]; then
            echo "GATE FALHOU: container não passou a responder em PORT=9123 dentro do prazo."
            docker logs ede-mcp-ci || true
            exit 1
          fi

      # Inspeciona /proc/net/tcp[6] DENTRO do container (sempre presente
      # em qualquer processo Linux, sem precisar instalar netstat/ss) —
      # prova o que o processo real está escutando, sem depender de
      # publicação de porta nenhuma do lado do host (ver achado acima).
      - name: "Provar que o processo só escuta na PORT fornecida (9123) — nunca 8080/8765"
        run: |
          portas_json=$(docker exec ede-mcp-ci python -c '
          import json
          portas = set()
          for arq in ("/proc/net/tcp", "/proc/net/tcp6"):
              try:
                  linhas = open(arq).read().splitlines()[1:]
              except FileNotFoundError:
                  continue
              for linha in linhas:
                  campos = linha.split()
                  if len(campos) > 3 and campos[3] == "0A":  # 0A = TCP_LISTEN
                      portas.add(int(campos[1].split(":")[1], 16))
          print(json.dumps(sorted(portas)))
          ')
          echo "Portas em LISTEN dentro do container: $portas_json"
          { echo "### Portas em LISTEN dentro do container real"; echo '```'; echo "$portas_json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if ! echo "$portas_json" | grep -q '9123'; then
            echo "GATE FALHOU: processo não está escutando em 9123 (PORT fornecida)."
            exit 1
          fi
          for porta_antiga in 8080 8765; do
            if echo "$portas_json" | grep -qE "(^|[^0-9])${porta_antiga}([^0-9]|$)"; then
              echo "GATE FALHOU: processo está escutando na porta antiga $porta_antiga (não deveria depender dela)."
              exit 1
            fi
          done
          echo "OK — processo escuta só em 9123; 8080 e 8765 ausentes."

      - name: "Cliente MCP real -> HTTP real -> container -> Streamable HTTP -> ede_health"
        run: |
          python .github/ci/homologar_container_mcp.py http://127.0.0.1:9123/mcp | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Encerrar e remover o container de teste (sempre, mesmo em falha)
        if: always()
        run: |
          docker logs ede-mcp-ci || true
          docker stop ede-mcp-ci || true
          docker rm ede-mcp-ci || true

      # --------------------------------------------- regressão do projeto
      # Só chega aqui se todo o gate acima do container já passou.
      # scripts/requirements.txt (lxml) já foi instalado na etapa "leve"
      # acima (necessário mesmo para os testes MCP, ver comentário lá).
      # Dependência PESADA (rag/requirements.txt traz pyarrow, pandas,
      # numpy, scikit-learn, scipy, sentence-transformers/torch) —
      # deliberadamente instalada só agora, nunca dentro da imagem do
      # container (ver step de inventário acima).
      - name: Instalar dependência pesada do projeto (rag/) para a suíte completa
        run: pip install -r rag/requirements.txt

      - name: "pytest tests/ (suíte completa, clone limpo — sem skills/docx/ presente)"
        run: pytest tests/ -q

      # SKIP não pode virar sinônimo de sucesso por omissão. --junit-xml
      # produz um relatório estruturado (tests/failures/errors/skipped +
      # razão de cada skip) que .github/ci/analisar_docx_real.py classifica
      # em UMA de seis categorias (A a F, ver docstring do script) — só a
      # categoria A (SKIP legítimo, razão idêntica em toda a suíte:
      # "não instalado localmente — asset institucional externo
      # (ADR-0009).") passa; qualquer outra (erro de coleta, marker
      # inexistente, import failure, zero testes coletados, falha real,
      # skip por motivo diferente) falha o gate explicitamente.
      # `set +e`/`set -e`: captura o exit code real do pytest sem deixar
      # o `errexit` do shell abortar a linha antes de repassá-lo ao
      # analisador.
      - name: "pytest -m docx_real — só SKIP legítimo (ADR-0009) é aceito, ver análise abaixo"
        run: |
          set +e
          pytest -m docx_real -v -rs --tb=short --junit-xml=docx_real_report.xml
          codigo=$?
          set -e
          python .github/ci/analisar_docx_real.py docx_real_report.xml "$codigo"

      # ============================================================
      # PUBLICAÇÃO OPCIONAL DO CANDIDATO IMUTÁVEL (Gate 6.4-B §17)
      # ============================================================
      #
      # Só roda com `publicar_candidato=true` E só depois de TODOS os
      # steps acima (build real + testes reais + testes negativos +
      # regressão completa + docx_real) já terem passado — uma falha em
      # qualquer um deles impede o job de chegar aqui (comportamento
      # padrão do GitHub Actions: step sem `if` só roda se os anteriores
      # tiverem sucedido). Nenhuma imagem que falhou um teste chega a ser
      # publicada.
      #
      # Reaproveita INTEGRALMENTE a identidade/infraestrutura já
      # homologada em .github/workflows/deploy-mcp-staging.yml
      # (ede-mcp-deployer via WIF, ede-mcp-builder via
      # mcp_server/cloudbuild.yaml, repositório Artifact Registry
      # `ede-mcp`) — nenhuma nova service account, nenhum novo
      # repositório, nenhuma nova infraestrutura. A ÚNICA diferença é a
      # TAG (`-candidato`, nunca a tag simples `${GITHUB_SHA}` que o
      # deploy de staging usa) e que este workflow para no build/push —
      # nunca chama `gcloud run deploy`, nunca toca tráfego, nunca cria
      # revision.
      - name: "Auth (WIF) — ede-mcp-deployer (só se publicar_candidato=true)"
        if: ${{ inputs.publicar_candidato }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - name: "Instalar Cloud SDK (só se publicar_candidato=true)"
        if: ${{ inputs.publicar_candidato }}
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: ${{ env.PROJECT_ID }}

      # Build determinístico via Cloud Build (nunca reaproveita a imagem
      # `ede-mcp:ci` construída localmente no runner acima com `docker
      # build` — mesma disciplina de deploy-mcp-staging.yml: quem
      # publica no Artifact Registry é sempre Cloud Build, nunca um push
      # direto do runner). Fonte: o MESMO commit já clonado e já testado
      # nesta execução — `gcloud builds submit .` empacota o working
      # directory atual do runner, que não foi modificado por nenhum
      # step anterior.
      - name: "Build (Cloud Build) — tag = ${{ github.sha }}-candidato (só se publicar_candidato=true)"
        if: ${{ inputs.publicar_candidato }}
        id: build_candidato
        run: |
          IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}-candidato"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"
          gcloud builds submit . \
            --project="$PROJECT_ID" \
            --config=mcp_server/cloudbuild.yaml \
            --substitutions=_IMAGE_URI="$IMAGE_URI" \
            --gcs-source-staging-dir=gs://ede-legal-mcp-01_cloudbuild/source

      - name: "Resolver DIGEST imutável publicado (só se publicar_candidato=true)"
        if: ${{ inputs.publicar_candidato }}
        run: |
          DIGEST=$(gcloud artifacts docker images describe "$IMAGE_URI" \
            --project="$PROJECT_ID" --format='value(image_summary.digest)')
          FULL_DIGEST="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE_NAME}@${DIGEST}"
          {
            echo "### Candidato imutável publicado (Gate 6.4-B)"
            echo '```'
            echo "Tag:    $IMAGE_URI"
            echo "Digest: $FULL_DIGEST"
            echo '```'
            echo ""
            echo "**Este digest é o ÚNICO candidato elegível para um futuro gate de deploy de produção.**"
            echo "Nenhum \`gcloud run deploy\` foi executado por este workflow — só build + push."
          } | tee -a "$GITHUB_STEP_SUMMARY"
